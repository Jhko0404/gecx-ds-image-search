openapi: 3.0.0
info:
  title: Layout Parser Custom Search API
  description: "CXAS/GECX 연동을 위한 Vertex AI Search Layout Parser 검색 중계 API (본문 텍스트, 이미지 및 PDF 원본 V4 Signed URL, 출처 및 페이지 제공)"
  version: 1.3.0
servers:
  - url: https://layout-parser-search-api-2v27qnoy2q-uc.a.run.app
    description: "Deployed Cloud Run Search Proxy Service"
paths:
  /search:
    post:
      summary: "Search the user manual PDF chunks"
      description: "Search layout parser chunks and return extracted text, signed image links, signed PDF document links, and source citations"
      operationId: searchManual
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                  description: "The search keyword or phrase"
              required:
                - query
      responses:
        '200':
          description: "Successfully retrieved layout segments, snippets, and citations"
          content:
            application/json:
              schema:
                type: object
                properties:
                  snippets:
                    type: array
                    items:
                      type: object
                      properties:
                        title:
                          type: string
                          description: "직관적인 문서명 및 페이지 표시 (예: CHPI-5820L-Manual p.36)"
                        source:
                          type: string
                          description: "출처 문서/매뉴얼 이름 (예: CHPI-5820L-Manual)"
                        page:
                          type: string
                          description: "매뉴얼 원본 페이지 번호 (예: 36)"
                        uri:
                          type: string
                          description: "다이어그램 이미지 V4 Signed URL 주소"
                        pdf_uri:
                          type: string
                          description: "원본 매뉴얼 PDF 문서 V4 Signed URL 주소"
                        text:
                          type: string
                          description: "매뉴얼 본문 텍스트 내용"
